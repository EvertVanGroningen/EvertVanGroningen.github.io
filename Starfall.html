<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Projects - Starfall</title>
    <style>
        :root {
            --primary-color: #a30730;
            --secondary-color: #0C2E59;
            --background-color: #4E2973;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-image: url('photo-1699891730676-037bed3c1bed.jfif');
            background-size: cover;
            background-position: center;
            background-repeat: repeat;
            color: white;
            text-align: center;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
            padding-bottom: 120px;
        }
        .project {
            background: var(--primary-color);
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }
        .project img {
            width: 100%;
            max-width: 600px;
            border-radius: 5px;
        }
        .project a {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background: var(--secondary-color);
            color: black;
            text-decoration: none;
            border-radius: 5px;
        }

        /* Afbeelding-doos zonder vergroten */
        .image-box {
            background: rgba(0, 0, 0, 0.5);
            display: inline-block;
            padding: 10px;
            border-radius: 10px;
            margin: 10px;
        }
        .image-box img {
            width: 250px;
            height: auto;
            border-radius: 5px;
        }

        /* Bottom bar */
        .bottom-bar {
            background-color: var(--secondary-color);
            padding: 25px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .bottom-bar a, .bottom-bar button {
            color: white;
            text-decoration: none;
            font-size: 18px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        .bottom-bar a:hover, .bottom-bar button:hover {
            text-decoration: underline;
        }

        .zoomable {
            cursor: zoom-in;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .zoomable:hover {
            transform: scale(1.02);
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.35);
        }

        .lightbox-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            cursor: zoom-out;
        }

        .lightbox-overlay.active {
            display: flex;
        }

        .lightbox-image {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            object-fit: contain;
            background: rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body>
<div class="container" id="content">
    <!-- Dynamische content wordt hier geladen -->
</div>

<div id="lightbox-overlay" class="lightbox-overlay" aria-hidden="true"></div>

<div class="bottom-bar">
    <a href="AboutMe.html">About me</a>
    <a href="Contacts.html">Contacts</a>
    <a href="Projects.html">Projects</a>
    <button id="lang-toggle">English</button>
</div>

<script>
    const langToggle = document.getElementById('lang-toggle');
    const content = document.getElementById('content');
    const lightboxOverlay = document.getElementById('lightbox-overlay');

    function closeLightbox() {
        if (!lightboxOverlay) return;
        lightboxOverlay.classList.remove('active');
        lightboxOverlay.innerHTML = '';
        lightboxOverlay.setAttribute('aria-hidden', 'true');
    }

    function bindZoomableImages() {
        document.querySelectorAll('img').forEach((img) => {
            if (img.dataset.zoomBound === 'true') return;
            img.classList.add('zoomable');
            img.dataset.zoomBound = 'true';
            img.addEventListener('click', (event) => {
                event.stopPropagation();
                if (!lightboxOverlay) return;
                const clone = img.cloneNode(true);
                clone.classList.add('lightbox-image');
                lightboxOverlay.innerHTML = '';
                lightboxOverlay.appendChild(clone);
                lightboxOverlay.classList.add('active');
                lightboxOverlay.setAttribute('aria-hidden', 'false');
            });
        });
    }

    if (lightboxOverlay) {
        lightboxOverlay.addEventListener('click', (event) => {
            if (event.target === lightboxOverlay) closeLightbox();
        });

        document.addEventListener('click', (event) => {
            if (lightboxOverlay.classList.contains('active') &&
                !event.target.closest('.lightbox-image') &&
                !event.target.closest('.zoomable')) {
                closeLightbox();
            }
        });
    }

    // ✅ Vertalingen
    const translations = {
        nl: {
            title: "Time-stop item",
            desc: `In een groepsproject genaamd Project starfall had ik een item gamaakt die de tijd stil zou zetten in een ruimte rond de speler.`,
            linkText: "Bekijk de code",
            imageDesc: "Visual design en model van het Time Stop-item",
            additText: "Dit project is gemaakt in Unity en C# en is onderdeel van een groter project genaamd Project Starfall. Mijn item, de time stop, was de eerste en tot nu toe enigste item die contact heeft met de vijanden en ze niet kapot maakt."
        },
        en: {
            title: "Time-stop item  ",
            desc: `In a group project called Project Starfall I created an item that would freeze time in a space around the player.`,
            linkText: "Go to the code",
            imageDesc: "Visual design and model of the Time Stop item",
            additText: "This project is made in Unity and C# and is part of a larger project called Project Starfall. My item, the time stop, was the first and so far only item that has contact with the enemies and doesn't destroy them."
        }
    };

    // ✅ Functie om de juiste taal te laden
    function loadLanguage(lang) {
        const data = translations[lang];
        closeLightbox();
        content.innerHTML = `
                <h1>${data.title}</h1>

                <div class="project">
                    <img src="TimeStopScreenShot.png" alt="Time Stop Screenshot">
                </div>

                <div class="project">
                    <p>${data.desc}</p>
                </div>

                <div>
                    <div class="project"><img src="VisualSheetTimeStopCopy.png" alt="${data.imageDesc}"></div>
                    <div class="project"><p>${data.additText}</p></div>
                    <div class="project"><img src="TimeBombSubstancePainterScreenshot.png" alt="${data.imageDesc}"></div>
                </div>

                <div class="project">
                    <a href="https://github.com/EvertVanGroningen/TimeStop" target="_blank">${data.linkText}</a>
                </div>
            `;
        bindZoomableImages();
        document.documentElement.lang = lang;
        langToggle.textContent = lang === 'nl' ? 'English' : 'Nederlands';
    }

    // ✅ Huidige taal laden of standaard NL
    let currentLang = localStorage.getItem('lang') || 'nl';
    loadLanguage(currentLang);

    // ✅ Wisselknop
    langToggle.addEventListener('click', () => {
        currentLang = currentLang === 'nl' ? 'en' : 'nl';
        localStorage.setItem('lang', currentLang);
        loadLanguage(currentLang);
    });
</script>
</body>
</html>
